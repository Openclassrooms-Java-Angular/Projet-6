<app-navbar></app-navbar>

<div class="feed-actions">
  <button type="button" mat-raised-button class="btn-primary" (click)="navigateToCreatePost()">
    Créer un article
  </button>
  <a class="sort-link" (click)="toggleSort()">Trier par {{ sortAsc ? '&darr;' : '&uarr;' }}</a>
</div>

<div class="posts">
  <app-post *ngFor="let post of posts" [post]="post"></app-post>
</div>
